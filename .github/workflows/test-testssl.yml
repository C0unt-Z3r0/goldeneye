name: Test and audit distributions

on:
  push:
    branches:
      - fix/repository-data-sanitization
  pull_request:
    branches:
      - main

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip build pytest rich jinja2 weasyprint dnspython python-whois httpx jinja2 weasyprint
      - name: Audit any committed distributions
        run: |
          if compgen -G "dist/*.whl" > /dev/null && compgen -G "dist/*.tar.gz" > /dev/null; then
            python scripts/audit_distribution.py dist/*.whl dist/*.tar.gz
          else
            echo "No committed distribution archives; the branch builds them from source below."
          fi
      - name: Rebuild distributions from the sanitized branch
        run: |
          mkdir -p dist
          rm -f dist/*.whl dist/*.tar.gz
          python -m build
      - name: Strictly audit rebuilt distributions
        run: python scripts/audit_distribution.py --strict dist/*.whl dist/*.tar.gz
      - name: Compile Python sources
        run: python -m compileall -q goldeneye tests
      - name: Run focused parser and runner tests
        run: python -m pytest -q tests/test_ai_analyzer.py tests/test_testssl_parser.py tests/test_testssl_runner.py tests/test_scope.py tests/test_pdf_generator.py tests/test_install_metadata.py tests/test_runner_timeouts.py tests/test_discovery_scope.py
