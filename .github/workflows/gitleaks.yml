name: Secret Scanning

on:
  push:
    branches:
      - main
      - fix/repository-data-sanitization
  pull_request:
    branches:
      - main
      - fix/repository-data-sanitization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@latest

      - name: Scan complete available Git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git \
            --redact \
            --exit-code 2 \
            --log-opts="--all" \
            .
