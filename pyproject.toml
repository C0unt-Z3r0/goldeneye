[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldeneye"
version = "1.0.0"
description = "Goldeneye - Security Assessment Assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "c0unt"}
]
keywords = ["pentest", "security", "vulnerability", "assessment", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "prompt-toolkit>=3.0.43",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "dnspython>=2.4.0",
    "python-whois>=0.8.0",
    "httpx>=0.25.0",
    "lxml>=4.9.0",
    "defusedxml>=0.7.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "matplotlib>=3.8.0",
    "openai>=1.6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
goldeneye = "goldeneye.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["goldeneye*"]
